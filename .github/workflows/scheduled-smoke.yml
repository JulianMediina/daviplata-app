name: scheduled-smoke

# Usa "<ambiente>-readonly" en vez de "<ambiente>" a propósito: este job es
# de solo lectura (un curl contra un endpoint público) disparado por cron,
# sin ningún humano presente para aprobar un gate de despliegue. El
# Environment "<ambiente>" (el que usa deploy.yml) exige aprobación humana
# para despliegues reales -heredarlo aquí deja la corrida en "waiting" para
# siempre (encontrado en la cuenta real: decenas de corridas acumuladas sin
# ejecutarse nunca). "<ambiente>-readonly" es un Environment aparte, sin
# reviewers, que existe solo para que el token OIDC conserve el claim
# "environment:<ambiente>-readonly" que el trust policy de IAM exige
# (ver terraform-foundation/bootstrap/main.tf) -sin ese claim, el trust
# policy no puede distinguir qué matriz corresponde a qué rol. (Un intento
# anterior quitó "environment:" del todo y rompió la autenticación OIDC con
# AccessDenied -confirmado en una corrida real.)
on:
  schedule:
    - cron: "*/30 * * * *" # cada 30 minutos
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        environment: [integracion, laboratorio, produccion]
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}-readonly
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: resolver endpoint (SSM)
        id: infra
        run: |
          endpoint=$(aws ssm get-parameter --name "/daviplata/${{ matrix.environment }}/ecs/service-endpoint" --query 'Parameter.Value' --output text)
          echo "service_endpoint=${endpoint}" >> "$GITHUB_OUTPUT"

      - name: smoke test (canario de bajo costo)
        run: scripts/smoke-test.sh "${{ steps.infra.outputs.service_endpoint }}"

      # Evita duplicar incidencias: si ya hay una abierta para este ambiente,
      # no crea otra -antes cada corrida fallida abria una nueva, y en un
      # ambiente con fallas repetidas (o intermitencias de red) eso llena el
      # tracker de decenas de issues idénticas en vez de una sola con
      # contexto acumulado.
      - name: abrir o actualizar incidencia si el ambiente no responde
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Smoke programado falló en ${{ matrix.environment }}`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "incident,${{ matrix.environment }}",
            });
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: `Volvió a fallar: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ["incident", "${{ matrix.environment }}"],
                body: `El smoke test programado no pudo validar /, /health.json o /version.json. Revisar el dashboard de CloudWatch y el log de este workflow: ${runUrl}`,
              });
            }

      # Cierra la incidencia abierta automaticamente cuando el ambiente
      # vuelve a responder -sin esto, una intermitencia transitoria deja el
      # issue abierto para siempre aunque el servicio ya este sano.
      - name: cerrar incidencia si el ambiente ya responde
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "incident,${{ matrix.environment }}",
            });
            for (const issue of existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "El smoke test programado volvió a pasar. Cerrando automáticamente.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
