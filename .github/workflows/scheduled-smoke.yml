name: scheduled-smoke

on:
  schedule:
    - cron: "*/30 * * * *" # cada 30 minutos
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        environment: [integracion, laboratorio, produccion]
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: resolver endpoint (SSM)
        id: infra
        run: |
          endpoint=$(aws ssm get-parameter --name "/daviplata/${{ matrix.environment }}/ecs/service-endpoint" --query 'Parameter.Value' --output text)
          echo "service_endpoint=${endpoint}" >> "$GITHUB_OUTPUT"

      - name: smoke test (canario de bajo costo)
        run: scripts/smoke-test.sh "${{ steps.infra.outputs.service_endpoint }}"

      - name: abrir incidencia si el ambiente no responde
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Smoke programado falló en ${{ matrix.environment }}`,
              labels: ["incident", "${{ matrix.environment }}"],
              body: "El smoke test programado no pudo validar / , /health.json o /version.json. Revisar el dashboard de CloudWatch y el log de este workflow.",
            });
