name: pr-validation

on:
  pull_request:
    branches: [integracion, laboratorio, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  branch-name:
    runs-on: ubuntu-latest
    steps:
      # La convención depende de a qué rama apunta el PR: contra "integracion"
      # tiene que venir de un feature/fix/release; contra "laboratorio" o
      # "main" tiene que venir exactamente de la rama de ambiente anterior
      # (promoción), no de cualquier rama — así se respeta el orden
      # feature -> integracion -> laboratorio -> main.
      - name: Validar convención de nombre de rama
        run: |
          base="${{ github.base_ref }}"
          head="${{ github.head_ref }}"
          case "$base" in
            integracion)
              if [[ ! "$head" =~ ^(feature|fix|release)/.+ ]]; then
                echo "PR hacia integracion debe venir de feature/*, fix/* o release/* (rama: '$head')." >&2
                exit 1
              fi
              ;;
            laboratorio)
              if [[ "$head" != "integracion" ]]; then
                echo "PR hacia laboratorio solo puede venir de la rama integracion (rama: '$head')." >&2
                exit 1
              fi
              ;;
            main)
              if [[ "$head" != "laboratorio" ]]; then
                echo "PR hacia main solo puede venir de la rama laboratorio (rama: '$head')." >&2
                exit 1
              fi
              ;;
          esac

  build-and-test:
    runs-on: ubuntu-latest
    needs: branch-name
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - name: build (bundle de referencia para tests)
        run: npm run build
        env:
          BUILD_ENVIRONMENT: integracion
          BUILD_VERSION: pr-${{ github.event.pull_request.number }}
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha }}

      - run: npm run test:links

      - run: npm run test:lhci
        continue-on-error: false

  security:
    needs: build-and-test
    uses: ./.github/workflows/reusable-security.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
