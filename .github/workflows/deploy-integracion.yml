name: deploy-integracion

# Dispara al cerrar (mergear) el PR hacia "integracion" — no con push directo.
# Así se usa github.event.pull_request.head.sha, el commit exacto que se
# revisó y aprobó, sin importar la estrategia de merge que haya usado GitHub.
on:
  pull_request:
    types: [closed]
    branches: [integracion]

permissions:
  contents: write
  id-token: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build-publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ github.event.pull_request.head.sha }}
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: build (bundle inmutable por commit)
        run: npm run build
        env:
          BUILD_ENVIRONMENT: integracion
          BUILD_VERSION: ${{ github.event.pull_request.head.sha }}
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha }}

      - name: configurar identidad de git para el tag de versión
        run: |
          git config user.name "daviplata-ci"
          git config user.email "ci@daviplata.local"

      - name: publicar como GitHub Release versionado
        id: publish
        run: |
          version=$(scripts/publish.sh "${{ github.event.pull_request.head.sha }}" "${{ github.repository }}" | tail -1)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: SCA con Trivy
        run: |
          mkdir -p /tmp/trivy-scan
          tar -xzf "site-${{ github.event.pull_request.head.sha }}.tar.gz" -C /tmp/trivy-scan
          docker run --rm -v /tmp/trivy-scan:/scan aquasec/trivy fs /scan \
            --severity CRITICAL,HIGH --exit-code 1 --no-progress

  deploy:
    needs: build-publish
    runs-on: ubuntu-latest
    environment: integracion
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: descargar artefacto publicado
        run: |
          gh release download "${{ needs.build-publish.outputs.version }}" --repo "${{ github.repository }}" --pattern "site-*.tar.gz"
          mkdir -p dist
          tar -xzf "site-"*.tar.gz -C dist

      - name: desplegar
        run: scripts/deploy.sh "${{ vars.SITE_BUCKET }}" "${{ vars.DISTRIBUTION_ID }}" integracion

      - name: smoke test
        id: smoke
        run: scripts/smoke-test.sh "https://${{ vars.DISTRIBUTION_DOMAIN }}" "${{ needs.build-publish.outputs.sha }}"

      - name: marcar como estable
        if: success()
        run: scripts/mark-stable.sh "${{ vars.SITE_BUCKET }}" "${{ needs.build-publish.outputs.sha }}"

      - name: rollback automático
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          scripts/rollback.sh "${{ vars.SITE_BUCKET }}" "${{ vars.DISTRIBUTION_ID }}" "${{ github.repository }}" integracion
          scripts/smoke-test.sh "https://${{ vars.DISTRIBUTION_DOMAIN }}"

      - name: subir evidencia de incidente
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rollback-incidente-integracion-${{ needs.build-publish.outputs.sha }}
          path: docs/evidence/rollback/*.log
          if-no-files-found: warn

      - name: Notificar resultado
        if: always() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "deploy-integracion ${{ needs.build-publish.outputs.version }} (${{ needs.build-publish.outputs.sha }}): ${{ job.status }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
