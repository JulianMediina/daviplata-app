name: deploy

# Un solo workflow para los 3 ambientes, con dos formas de disparo real:
#   - workflow_dispatch: "release.yml" lo dispara explícitamente al terminar
#     de publicar en ECR (con --ref integracion), y también sirve para
#     redesplegar manualmente sin abrir un PR. No se usa workflow_run aquí
#     a propósito: ese disparador SIEMPRE ejecuta el archivo del workflow
#     tal como existe en la rama default del repo (main), sin importar qué
#     rama generó el evento — con branch-per-environment, eso significa que
#     un cambio a deploy.yml no tendría efecto en el despliegue automático a
#     integración hasta que llegara a main por la cadena de promoción
#     normal. workflow_dispatch con --ref explícito no tiene ese problema.
#   - pull_request cerrado hacia laboratorio/main: promociones — no se
#     reconstruye nada, se copia la imagen ya publicada del ambiente
#     anterior al repositorio ECR del ambiente destino y se apunta el
#     servicio a ella.
on:
  pull_request:
    types: [closed]
    branches: [laboratorio, main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente a desplegar"
        required: true
        type: choice
        options: [integracion, laboratorio, produccion]
      version:
        description: "Versión a desplegar (vX.Y.Z)"
        required: true

permissions:
  contents: read
  id-token: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  deploy:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.base_ref == 'main' && 'produccion' || github.base_ref) }}
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: resolver ambiente y rama
        id: ctx
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) env_name="${{ inputs.environment }}" ;;
            *)
              base="${{ github.base_ref }}"
              if [ "$base" = "main" ]; then env_name="produccion"; else env_name="$base"; fi
              ;;
          esac
          if [ "$env_name" = "produccion" ]; then branch="main"; else branch="$env_name"; fi
          case "$env_name" in
            integracion) previous="" ;;
            laboratorio) previous="integracion" ;;
            produccion)  previous="laboratorio" ;;
          esac
          echo "environment=${env_name}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "previous_environment=${previous}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.branch }}
          fetch-depth: 0

      - name: resolver versión a desplegar
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            # HEAD ya es la punta de la rama recien mergeada (ver checkout
            # arriba: ref: steps.ctx.outputs.branch) -el tag alcanzable mas
            # reciente desde ahi es la version que se promovio. No se usa
            # github.event.pull_request.head.sha: el repo fuerza squash-merge,
            # que descarta ese commit por completo (no queda como ancestro de
            # la rama destino), asi que "--merged <ese sha>" siempre fallaba
            # con "must point to a commit" para cualquier promocion real.
            version=$(git tag --sort=-v:refname --merged HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            if [ -z "$version" ]; then
              echo "No encontré ningún tag de versión alcanzable desde HEAD" >&2
              exit 1
            fi
          fi
          build_sha=$(git rev-list -n1 "$version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=${build_sha}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # terraform-live publica estos valores en SSM Parameter Store al
      # aplicar; evita depender de que alguien copie variables a mano entre
      # repos cada vez que cambia la infraestructura.
      - name: resolver infraestructura (SSM)
        id: infra
        run: |
          prefix="/daviplata/${{ steps.ctx.outputs.environment }}"
          echo "repository_url=$(aws ssm get-parameter --name "${prefix}/ecr/repository-url" --query 'Parameter.Value' --output text)" >> "$GITHUB_OUTPUT"
          echo "cluster_name=$(aws ssm get-parameter --name "${prefix}/ecs/cluster-name" --query 'Parameter.Value' --output text)" >> "$GITHUB_OUTPUT"
          echo "service_name=$(aws ssm get-parameter --name "${prefix}/ecs/service-name" --query 'Parameter.Value' --output text)" >> "$GITHUB_OUTPUT"
          echo "service_arn=$(aws ssm get-parameter --name "${prefix}/ecs/service-arn" --query 'Parameter.Value' --output text)" >> "$GITHUB_OUTPUT"
          echo "service_endpoint=$(aws ssm get-parameter --name "${prefix}/ecs/service-endpoint" --query 'Parameter.Value' --output text)" >> "$GITHUB_OUTPUT"
          echo "sns_topic_arn=$(aws ssm get-parameter --name "${prefix}/sns/topic-arn" --query 'Parameter.Value' --output text)" >> "$GITHUB_OUTPUT"
          if [ -n "${{ steps.ctx.outputs.previous_environment }}" ]; then
            source_url=$(aws ssm get-parameter --name "/daviplata/${{ steps.ctx.outputs.previous_environment }}/ecr/repository-url" --query 'Parameter.Value' --output text)
            echo "source_repository_url=${source_url}" >> "$GITHUB_OUTPUT"
          fi

      - name: login en ECR
        if: steps.ctx.outputs.environment != 'integracion'
        uses: aws-actions/amazon-ecr-login@v2

      - name: promover imagen (copiar del ambiente anterior, sin reconstruir)
        if: steps.ctx.outputs.environment != 'integracion'
        run: |
          scripts/promote-image.sh \
            "${{ steps.infra.outputs.source_repository_url }}" \
            "${{ steps.infra.outputs.repository_url }}" \
            "${{ steps.version.outputs.version }}"

      - name: desplegar
        id: deploy
        run: |
          scripts/deploy-ecs.sh \
            "${{ steps.infra.outputs.service_arn }}" \
            "${{ steps.infra.outputs.cluster_name }}" \
            "${{ steps.infra.outputs.service_name }}" \
            "${{ steps.infra.outputs.repository_url }}" \
            "${{ steps.version.outputs.version }}"

      - name: smoke test
        id: smoke
        run: scripts/smoke-test.sh "${{ steps.infra.outputs.service_endpoint }}" "${{ steps.version.outputs.sha }}"

      - name: marcar como estable
        if: success()
        run: scripts/mark-stable.sh "${{ steps.ctx.outputs.environment }}" "${{ steps.version.outputs.version }}"

      - name: rollback automático
        if: failure() && (steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure')
        run: |
          scripts/rollback-ecs.sh \
            "${{ steps.infra.outputs.service_arn }}" \
            "${{ steps.infra.outputs.cluster_name }}" \
            "${{ steps.infra.outputs.service_name }}" \
            "${{ steps.infra.outputs.repository_url }}" \
            "${{ steps.ctx.outputs.environment }}"
          scripts/smoke-test.sh "${{ steps.infra.outputs.service_endpoint }}"

      - name: notificar por correo (SNS)
        if: always()
        run: |
          topic_arn="${{ steps.infra.outputs.sns_topic_arn }}"
          if [ -z "$topic_arn" ]; then
            echo "sin sns_topic_arn disponible, omito notificación"
            exit 0
          fi
          message=$(printf 'Ambiente: %s\nVersion: %s\nCommit: %s\nResultado: %s\nRun: %s' \
            "${{ steps.ctx.outputs.environment }}" \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.sha }}" \
            "${{ job.status }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          aws sns publish \
            --topic-arn "$topic_arn" \
            --subject "deploy-${{ steps.ctx.outputs.environment }} ${{ steps.version.outputs.version }}: ${{ job.status }}" \
            --message "$message"

      - name: Notificar resultado
        if: always() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "deploy-${{ steps.ctx.outputs.environment }} ${{ steps.version.outputs.version }} (${{ steps.version.outputs.sha }}): ${{ job.status }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
