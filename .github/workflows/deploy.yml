name: deploy

# Un solo workflow para los 3 ambientes, con dos formas de disparo real:
#   - workflow_run: cuando "release" (build+publicación) termina bien, se
#     despliega automáticamente a integración con lo que se acaba de publicar.
#   - pull_request cerrado hacia laboratorio/main: promociones — no se
#     reconstruye nada, se resuelve y descarga el release ya publicado.
# workflow_dispatch queda como reintento manual (p.ej. redesplegar la misma
# versión sin abrir un PR nuevo).
on:
  workflow_run:
    workflows: ["release"]
    types: [completed]
  pull_request:
    types: [closed]
    branches: [laboratorio, main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente a desplegar"
        required: true
        type: choice
        options: [integracion, laboratorio, produccion]
      version:
        description: "Versión a desplegar (vX.Y.Z)"
        required: true

permissions:
  contents: write
  id-token: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  deploy:
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event_name == 'workflow_run' && 'integracion' || (github.base_ref == 'main' && 'produccion' || github.base_ref)) }}
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: resolver ambiente y rama
        id: ctx
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) env_name="${{ inputs.environment }}" ;;
            workflow_run) env_name="integracion" ;;
            *)
              base="${{ github.base_ref }}"
              if [ "$base" = "main" ]; then env_name="produccion"; else env_name="$base"; fi
              ;;
          esac
          if [ "$env_name" = "produccion" ]; then branch="main"; else branch="$env_name"; fi
          echo "environment=${env_name}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.branch }}
          fetch-depth: 0

      - name: resolver versión del release
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            if [ "${{ github.event_name }}" = "workflow_run" ]; then
              source_sha="${{ github.event.workflow_run.head_sha }}"
            else
              source_sha="${{ github.event.pull_request.head.sha }}"
            fi
            # El sha de origen puede ser un commit de merge (promoción) o el
            # commit exacto que construyó "release" (primer despliegue) — el
            # tag alcanzable más reciente cubre ambos casos por igual.
            version=$(git tag --sort=-v:refname --merged "$source_sha" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            if [ -z "$version" ]; then
              echo "No encontré ningún tag de versión alcanzable desde $source_sha" >&2
              exit 1
            fi
          fi
          build_sha=$(git rev-list -n1 "$version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=${build_sha}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: marcar promoción
        if: steps.ctx.outputs.environment != 'integracion'
        run: scripts/promote.sh "${{ steps.version.outputs.sha }}" "${{ github.repository }}" "${{ steps.ctx.outputs.environment }}"

      - name: descargar artefacto publicado
        run: |
          gh release download "${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" --pattern "site-*.tar.gz"
          mkdir -p dist
          tar -xzf "site-"*.tar.gz -C dist

      - name: desplegar
        run: scripts/deploy.sh "${{ vars.SITE_BUCKET }}" "${{ vars.DISTRIBUTION_ID }}" "${{ steps.ctx.outputs.environment }}"

      - name: smoke test
        id: smoke
        run: scripts/smoke-test.sh "https://${{ vars.DISTRIBUTION_DOMAIN }}" "${{ steps.version.outputs.sha }}"

      - name: marcar como estable
        if: success()
        run: scripts/mark-stable.sh "${{ vars.SITE_BUCKET }}" "${{ steps.version.outputs.sha }}"

      - name: rollback automático
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          scripts/rollback.sh "${{ vars.SITE_BUCKET }}" "${{ vars.DISTRIBUTION_ID }}" "${{ github.repository }}" "${{ steps.ctx.outputs.environment }}"
          scripts/smoke-test.sh "https://${{ vars.DISTRIBUTION_DOMAIN }}"

      - name: subir evidencia de incidente
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rollback-incidente-${{ steps.ctx.outputs.environment }}-${{ steps.version.outputs.sha }}
          path: docs/evidence/rollback/*.log
          if-no-files-found: warn

      - name: notificar por correo (SNS)
        if: always()
        run: |
          message=$(printf 'Ambiente: %s\nVersion: %s\nCommit: %s\nResultado: %s\nRun: %s' \
            "${{ steps.ctx.outputs.environment }}" \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.sha }}" \
            "${{ job.status }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          aws sns publish \
            --topic-arn "${{ vars.SNS_TOPIC_ARN }}" \
            --subject "deploy-${{ steps.ctx.outputs.environment }} ${{ steps.version.outputs.version }}: ${{ job.status }}" \
            --message "$message"

      - name: Notificar resultado
        if: always() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "deploy-${{ steps.ctx.outputs.environment }} ${{ steps.version.outputs.version }} (${{ steps.version.outputs.sha }}): ${{ job.status }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
