name: release

# Build + publicación como imagen versionada en ECR (semver por Conventional
# Commits). Dispara con push a "integracion" — no con pull_request:closed:
# semantic-release detecta el evento de CI y se niega a publicar si lo
# corre un pull_request ("This run was triggered by a pull request and
# therefore a new version won't be published"), sin importar si el PR ya
# está mergeado. El repo tiene deshabilitado merge commit y rebase merge
# (solo squash), así que cada push a integracion es exactamente un commit:
# el título del PR como mensaje (squash_merge_commit_title=PR_TITLE), que
# es lo que valida pr-title en pr-validation.yml y lo que lee
# @semantic-release/commit-analyzer.
# El despliegue real a integración lo dispara este mismo workflow al final,
# vía "gh workflow run deploy.yml --ref integracion" (ver último paso) — no
# con el disparador workflow_run, que SIEMPRE ejecuta el archivo del
# workflow tal como existe en la rama default del repo (main), sin importar
# qué rama generó el evento. Mientras un cambio a deploy.yml no llegue a
# main por la cadena de promoción normal, workflow_run seguiría corriendo
# la versión vieja para el despliegue automático a integración -un disparo
# explícito con --ref evita ese problema.
on:
  push:
    branches: [integracion]

permissions:
  contents: write
  id-token: write
  actions: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: integracion
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # Lee Conventional Commits desde el último tag alcanzable (no solo el
      # último commit) y crea + empuja el tag vX.Y.Z. pr-validation.yml ya
      # exige que el título del PR (mensaje del squash-merge) traiga un
      # prefijo reconocible, así que "no hubo release" aquí solo puede
      # significar un error real, no una omisión silenciosa.
      - name: semantic-release (calcula versión y crea el tag)
        id: semrel
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 23
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: daviplata-ci
          GIT_AUTHOR_EMAIL: ci@daviplata.local
          GIT_COMMITTER_NAME: daviplata-ci
          GIT_COMMITTER_EMAIL: ci@daviplata.local

      - name: verificar que se publicó una versión
        if: steps.semrel.outputs.new_release_published != 'true'
        run: |
          echo "semantic-release no generó ninguna version nueva para este merge." >&2
          echo "Revisa que el titulo del PR haya traido un prefijo Conventional Commits valido (feat:, fix:, etc.)." >&2
          exit 1

      - name: build (bundle inmutable por commit)
        run: npm run build
        env:
          BUILD_ENVIRONMENT: integracion
          BUILD_VERSION: ${{ steps.semrel.outputs.new_release_git_tag }}
          BUILD_COMMIT: ${{ github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # terraform-live publica estos valores en SSM Parameter Store al
      # aplicar; evita depender de que alguien copie variables a mano entre
      # repos cada vez que cambia la infraestructura.
      - name: resolver infraestructura (SSM)
        id: infra
        run: |
          repository_url=$(aws ssm get-parameter --name "/daviplata/integracion/ecr/repository-url" --query 'Parameter.Value' --output text)
          echo "repository_url=${repository_url}" >> "$GITHUB_OUTPUT"

      - name: login en ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: build de la imagen
        run: |
          docker build \
            -t "${{ steps.infra.outputs.repository_url }}:${{ steps.semrel.outputs.new_release_git_tag }}" \
            .

      - name: SCA con Trivy (imagen)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image \
            --severity CRITICAL,HIGH --exit-code 1 --no-progress \
            "${{ steps.infra.outputs.repository_url }}:${{ steps.semrel.outputs.new_release_git_tag }}"

      - name: publicar imagen en ECR
        run: docker push "${{ steps.infra.outputs.repository_url }}:${{ steps.semrel.outputs.new_release_git_tag }}"

      # --ref integracion asegura que se ejecute la versión de deploy.yml que
      # de verdad existe en esta rama, no la que haya en main en este momento
      # (a diferencia de workflow_run, que ignora --ref y siempre usa main).
      - name: disparar despliegue a integración
        run: |
          gh workflow run deploy.yml \
            --repo "${{ github.repository }}" \
            --ref integracion \
            -f environment=integracion \
            -f version="${{ steps.semrel.outputs.new_release_git_tag }}"
