name: release

# Build + publicación como imagen versionada en ECR (semver por Conventional
# Commits). Dispara al cerrar (mergear) el PR hacia "integracion" — nunca
# con push directo, para usar github.event.pull_request.head.sha como
# referencia exacta del commit revisado, sin importar la estrategia de
# merge que use GitHub.
# El despliegue real a integración lo dispara "deploy" al terminar este
# workflow (ver deploy.yml, disparador workflow_run) — separado para que
# la lógica de build/release y la de desplegar+verificar no compartan un
# mismo archivo ni un mismo job.
on:
  pull_request:
    types: [closed]
    branches: [integracion]

permissions:
  contents: write
  id-token: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: integracion
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: calcular versión semántica
        id: version
        run: |
          version=$(scripts/next-version.sh "${{ github.event.pull_request.head.sha }}")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: build (bundle inmutable por commit)
        run: npm run build
        env:
          BUILD_ENVIRONMENT: integracion
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha }}

      - name: configurar identidad de git para el tag de versión
        run: |
          git config user.name "daviplata-ci"
          git config user.email "ci@daviplata.local"

      - name: etiquetar versión
        run: scripts/tag-version.sh "${{ steps.version.outputs.version }}" "${{ github.event.pull_request.head.sha }}"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: login en ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: build de la imagen
        run: |
          docker build \
            -t "${{ vars.REPOSITORY_URL }}:${{ steps.version.outputs.version }}" \
            .

      - name: SCA con Trivy (imagen)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image \
            --severity CRITICAL,HIGH --exit-code 1 --no-progress \
            "${{ vars.REPOSITORY_URL }}:${{ steps.version.outputs.version }}"

      - name: publicar imagen en ECR
        run: docker push "${{ vars.REPOSITORY_URL }}:${{ steps.version.outputs.version }}"
