name: release

# Build + publicación como imagen versionada en ECR (semver por Conventional
# Commits). Dispara al cerrar (mergear) el PR hacia "integracion" — nunca
# con push directo, para usar github.event.pull_request.head.sha como
# referencia exacta del commit revisado, sin importar la estrategia de
# merge que use GitHub.
# El despliegue real a integración lo dispara este mismo workflow al final,
# vía "gh workflow run deploy.yml --ref integracion" (ver último paso) — no
# con el disparador workflow_run, que SIEMPRE ejecuta el archivo del
# workflow tal como existe en la rama default del repo (main), sin importar
# qué rama generó el evento. Mientras un cambio a deploy.yml no llegue a
# main por la cadena de promoción normal, workflow_run seguiría corriendo
# la versión vieja para el despliegue automático a integración -un disparo
# explícito con --ref evita ese problema.
on:
  pull_request:
    types: [closed]
    branches: [integracion]

permissions:
  contents: write
  id-token: write
  actions: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: integracion
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: calcular versión semántica
        id: version
        run: |
          version=$(scripts/next-version.sh "${{ github.event.pull_request.head.sha }}")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: build (bundle inmutable por commit)
        run: npm run build
        env:
          BUILD_ENVIRONMENT: integracion
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha }}

      - name: configurar identidad de git para el tag de versión
        run: |
          git config user.name "daviplata-ci"
          git config user.email "ci@daviplata.local"

      - name: etiquetar versión
        run: scripts/tag-version.sh "${{ steps.version.outputs.version }}" "${{ github.event.pull_request.head.sha }}"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      # terraform-live publica estos valores en SSM Parameter Store al
      # aplicar; evita depender de que alguien copie variables a mano entre
      # repos cada vez que cambia la infraestructura.
      - name: resolver infraestructura (SSM)
        id: infra
        run: |
          repository_url=$(aws ssm get-parameter --name "/daviplata/integracion/ecr/repository-url" --query 'Parameter.Value' --output text)
          echo "repository_url=${repository_url}" >> "$GITHUB_OUTPUT"

      - name: login en ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: build de la imagen
        run: |
          docker build \
            -t "${{ steps.infra.outputs.repository_url }}:${{ steps.version.outputs.version }}" \
            .

      - name: SCA con Trivy (imagen)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image \
            --severity CRITICAL,HIGH --exit-code 1 --no-progress \
            "${{ steps.infra.outputs.repository_url }}:${{ steps.version.outputs.version }}"

      - name: publicar imagen en ECR
        run: docker push "${{ steps.infra.outputs.repository_url }}:${{ steps.version.outputs.version }}"

      # --ref integracion asegura que se ejecute la versión de deploy.yml que
      # de verdad existe en esta rama, no la que haya en main en este momento
      # (a diferencia de workflow_run, que ignora --ref y siempre usa main).
      - name: disparar despliegue a integración
        run: |
          gh workflow run deploy.yml \
            --repo "${{ github.repository }}" \
            --ref integracion \
            -f environment=integracion \
            -f version="${{ steps.version.outputs.version }}"
