name: deploy-laboratorio

# Dispara al cerrar (mergear) el PR de promoción integracion -> laboratorio.
# No reconstruye nada: resuelve qué versión (tag vX.Y.Z) corresponde al
# commit promovido y descarga ese mismo artefacto ya publicado.
on:
  pull_request:
    types: [closed]
    branches: [laboratorio]

permissions:
  contents: write
  id-token: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: laboratorio
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: resolver versión del commit promovido
        id: version
        run: |
          sha="${{ github.event.pull_request.head.sha }}"
          # El head.sha de un PR de promoción es la punta de la rama origen,
          # que tras el merge suele ser un commit de merge distinto del commit
          # que se etiquetó — por eso se busca el tag alcanzable (ancestro)
          # más reciente en vez de exigir coincidencia exacta.
          version=$(git tag --sort=-v:refname --merged "$sha" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$version" ]; then
            echo "No encontré ningún tag de versión alcanzable desde $sha" >&2
            exit 1
          fi
          # El commit que importa aguas abajo (smoke test, stable pointer,
          # rollback) es el que realmente se construyó y horneó en el
          # artefacto -es decir, al que apunta el tag- no la punta de la
          # rama de promoción.
          build_sha=$(git rev-list -n1 "$version")
          echo "sha=${build_sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: marcar promoción a laboratorio
        run: scripts/promote.sh "${{ steps.version.outputs.sha }}" "${{ github.repository }}" laboratorio

      - name: descargar artefacto promovido
        run: |
          gh release download "${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" --pattern "site-*.tar.gz"
          mkdir -p dist
          tar -xzf "site-"*.tar.gz -C dist

      - name: desplegar
        run: scripts/deploy.sh "${{ vars.SITE_BUCKET }}" "${{ vars.DISTRIBUTION_ID }}" laboratorio

      - name: smoke test
        id: smoke
        run: scripts/smoke-test.sh "https://${{ vars.DISTRIBUTION_DOMAIN }}" "${{ steps.version.outputs.sha }}"

      - name: marcar como estable
        if: success()
        run: scripts/mark-stable.sh "${{ vars.SITE_BUCKET }}" "${{ steps.version.outputs.sha }}"

      - name: rollback automático
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          scripts/rollback.sh "${{ vars.SITE_BUCKET }}" "${{ vars.DISTRIBUTION_ID }}" "${{ github.repository }}" laboratorio
          scripts/smoke-test.sh "https://${{ vars.DISTRIBUTION_DOMAIN }}"

      - name: subir evidencia de incidente
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rollback-incidente-laboratorio-${{ steps.version.outputs.sha }}
          path: docs/evidence/rollback/*.log
          if-no-files-found: warn

      - name: notificar por correo (SNS)
        if: always()
        run: |
          message=$(printf 'Ambiente: laboratorio\nVersion: %s\nCommit: %s\nResultado: %s\nRun: %s' \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.sha }}" \
            "${{ job.status }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          aws sns publish \
            --topic-arn "${{ vars.SNS_TOPIC_ARN }}" \
            --subject "deploy-laboratorio ${{ steps.version.outputs.version }}: ${{ job.status }}" \
            --message "$message"

      - name: Notificar resultado
        if: always() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "deploy-laboratorio ${{ steps.version.outputs.version }} (${{ steps.version.outputs.sha }}): ${{ job.status }}"
            }
