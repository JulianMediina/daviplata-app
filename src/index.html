<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Panel estático de estado y versión de la plataforma DaviPlata.">
  <title>DaviPlata · Estado de la plataforma</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <main class="card">
    <header class="card__header">
      <img class="card__logo" src="assets/logo.svg" alt="DaviPlata" width="48" height="48">
      <h1>DaviPlata · Panel de estado</h1>
    </header>

    <p class="card__subtitle">DaviPlata</p>

    <dl class="status-grid" id="status-grid" aria-live="polite">
      <dt>Ambiente</dt>
      <dd id="field-environment">cargando…</dd>

      <dt>Versión</dt>
      <dd id="field-version">cargando…</dd>

      <dt>Commit</dt>
      <dd id="field-commit">cargando…</dd>

      <dt>Construido</dt>
      <dd id="field-build-time">cargando…</dd>

      <dt>Salud</dt>
      <dd id="field-health">cargando…</dd>
    </dl>

    <footer class="card__footer">
      <a href="health.json">/health.json</a>
      <a href="version.json">/version.json</a>
    </footer>
  </main>

  <script src="js/status.js"></script>
</body>
</html>
