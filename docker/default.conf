# Reemplaza las cabeceras de seguridad que antes ponía la
# response-headers-policy de CloudFront -al servir directo desde el
# contenedor (sin CDN por delante), le toca a nginx ponerlas.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # config.json y version.json cambian por despliegue/ambiente sin cambiar
    # de imagen (los inyecta 40-inject-config.sh en el arranque) - nunca deben
    # quedar cacheados.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    location = /version.json {
        add_header Cache-Control "no-store";
    }
}
